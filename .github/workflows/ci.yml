name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & test
        working-directory: backend
        run: mvn -B clean verify

  frontend:
    name: Frontend (Vue 3 / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  research:
    name: Research (Python 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install & smoke test
        working-directory: research
        run: |
          pip install -r requirements.txt
          python -c "import app.main; import app.backtest.vectorized; print('research OK')"

  images:
    name: Build & push images
    needs: [ backend, frontend ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Package jars
        working-directory: backend
        run: mvn -B clean install -DskipTests
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push service images
        working-directory: backend
        run: |
          VER=1.0.0-SNAPSHOT
          REPO=ghcr.io/${{ github.repository_owner }}
          for s in api-gateway auth-service market-data-service strategy-service \
                   order-execution-service risk-service account-service backtest-service; do
            docker build -t "$REPO/$s:${GITHUB_REF_NAME}" \
              --build-arg JAR="$s/target/$s-$VER.jar" -f Dockerfile .
            docker push "$REPO/$s:${GITHUB_REF_NAME}"
          done
