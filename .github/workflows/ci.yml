name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & test
        working-directory: backend
        run: set -o pipefail; mvn -B clean verify 2>&1 | tee build.log
      - name: Upload jars for boot smoke
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: backend/*/target/*-1.0.0-SNAPSHOT.jar
          retention-days: 1
      - name: Surface Maven errors as annotations
        if: failure()
        working-directory: backend
        run: |
          grep -E '\[ERROR\]|Tests run:.*Failures: [1-9]|Tests run:.*Errors: [1-9]|<<< (FAILURE|ERROR)!' build.log \
            | grep -vE 'Re-run Maven|For more information|\[Help [0-9]\]|^\[ERROR\] *$' \
            | head -60 | sed 's/^/::error::/'

  boot-smoke:
    name: Boot smoke (每支服務真的起一次)
    needs: backend
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env: { POSTGRES_USER: quant, POSTGRES_PASSWORD: quant, POSTGRES_DB: quant }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quant -d quant" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: service-jars, path: backend }
      - name: init.sql（extension）
        run: PGPASSWORD=quant psql -h localhost -U quant -d quant -v ON_ERROR_STOP=1 -f infra/init/timescale-init.sql
      - name: 逐一啟動 9 支服務
        run: .github/scripts/boot_smoke.sh

  schema:
    name: Schema (Flyway on TimescaleDB)
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env: { POSTGRES_USER: quant, POSTGRES_PASSWORD: quant, POSTGRES_DB: quant }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quant -d quant" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: init.sql（extension）
        run: PGPASSWORD=quant psql -h localhost -U quant -d quant -v ON_ERROR_STOP=1 -f infra/init/timescale-init.sql
      - name: Flyway migrate（全新庫）
        run: |
          docker run --rm --network host -v "$PWD/backend/common/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:10 -url=jdbc:postgresql://localhost:5432/quant -user=quant -password=quant migrate
      - name: 模擬舊庫：清掉 history 後以 baseline-version=0 再跑一次（V1 必須可重跑）
        run: |
          PGPASSWORD=quant psql -h localhost -U quant -d quant -c "DROP TABLE flyway_schema_history;"
          docker run --rm --network host -v "$PWD/backend/common/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:10 -url=jdbc:postgresql://localhost:5432/quant -user=quant -password=quant \
            -baselineOnMigrate=true -baselineVersion=0 migrate
      - name: 表都在
        run: |
          for t in kline orders positions order_outbox equity_curve users; do
            PGPASSWORD=quant psql -h localhost -U quant -d quant -tAc "select to_regclass('$t')" | grep -q "^$t$" || { echo "::error::缺表 $t"; exit 1; }
          done
          PGPASSWORD=quant psql -h localhost -U quant -d quant -tAc "select count(*) from timescaledb_information.hypertables where hypertable_name='kline'" | grep -q '^1$' || { echo "::error::kline 不是 hypertable"; exit 1; }

  frontend:
    name: Frontend (Vue 3 / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
      - name: nginx.conf 語法檢查
        run: docker run --rm -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
      - name: docker-compose.prod.yml 語法/合併檢查
        run: docker compose -f docker-compose.prod.yml config -q

  research:
    name: Research (Python 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install & smoke test
        working-directory: research
        run: |
          pip install -r requirements.txt
          python -c "import app.main; import app.backtest.vectorized; print('research OK')"

  images:
    name: Build & push images
    needs: [ backend, frontend ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Package jars
        working-directory: backend
        run: mvn -B clean install -DskipTests
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push service images
        working-directory: backend
        run: |
          VER=1.0.0-SNAPSHOT
          REPO=ghcr.io/${{ github.repository_owner }}
          for s in api-gateway auth-service market-data-service strategy-service \
                   order-execution-service risk-service account-service backtest-service; do
            docker build -t "$REPO/$s:${GITHUB_REF_NAME}" \
              --build-arg JAR="$s/target/$s-$VER.jar" -f Dockerfile .
            docker push "$REPO/$s:${GITHUB_REF_NAME}"
          done
