server:
  port: 8098
  servlet:
    context-path: /api/notify

spring:
  application:
    name: notification-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        fail-fast: false        # Nacos 還沒好時註冊失敗不炸掉服務，背景重試（以前 failFast=true → 一直重啟）
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASS:nacos}
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.quant.common.*"
        spring.json.value.default.type: com.quant.common.event.OrderEvent

management:
  endpoint:
    health:
      show-details: always     # 系統狀態頁要看 db / redis / kafka / discovery 各元件
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

notification:
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  dedupe-enabled: ${NOTIFY_DEDUPE_ENABLED:true}
  dedupe-window-sec: ${NOTIFY_DEDUPE_WINDOW_SEC:600}   # 同類告警 10 分鐘內只發一則，其餘計數後補「+N」
  kafka-lag:
    enabled: ${KAFKA_LAG_MONITOR_ENABLED:true}
    threshold: ${KAFKA_LAG_THRESHOLD:500}              # 連續兩次（60 秒）超過才告警
