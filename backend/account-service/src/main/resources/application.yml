server:
  port: 8096
  servlet:
    context-path: /api/account

spring:
  application:
    name: account-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASS:nacos}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/quant
    username: quant
    password: quant
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    consumer:
      group-id: account-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.quant.common.*"
        spring.json.value.default.type: com.quant.common.event.OrderEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

risk:
  max-drawdown: ${RISK_MAX_DRAWDOWN:0.1}

funding:
  symbols: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,DOTUSDT,LINKUSDT,LTCUSDT,TRXUSDT,BCHUSDT,UNIUSDT,ATOMUSDT,XLMUSDT,ETCUSDT,FILUSDT,APTUSDT,NEARUSDT

binance:
  env: ${BINANCE_ENV:testnet}
  rest-base-url: ${BINANCE_REST:https://testnet.binance.vision}
  mainnet-rest-url: ${BINANCE_MAINNET_REST:https://api.binance.com}
  mainnet-api-key: ${BINANCE_MAINNET_API_KEY:}
  mainnet-api-secret: ${BINANCE_MAINNET_API_SECRET:}
  market-rest-url: ${MARKET_REST:https://api.binance.com}
  api-key: ${BINANCE_API_KEY:}
  api-secret: ${BINANCE_API_SECRET:}
  futures-rest-url: ${BINANCE_FUTURES_REST:https://testnet.binancefuture.com}
