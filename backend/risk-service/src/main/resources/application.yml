server:
  port: 8085
  servlet:
    context-path: /api/risk

spring:
  application:
    name: risk-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASS:nacos}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/quant
    username: quant
    password: quant
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    consumer:
      group-id: risk-service
      properties:
        spring.json.trusted.packages: "com.quant.common.*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

risk:
  max-order-qty: 1.0
  kill-switch: false
