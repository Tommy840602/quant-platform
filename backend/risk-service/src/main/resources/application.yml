server:
  port: 8085
  servlet:
    context-path: /api/risk

spring:
  application:
    name: risk-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASS:nacos}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/quant
    username: quant
    password: quant
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    consumer:
      group-id: risk-service
      properties:
        spring.json.trusted.packages: "com.quant.common.*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

risk:
  # 以「個數」計的上限對便宜幣不適用；真正的尺度控制在 order-execution 的名目金額上限(RISK_MAX_NOTIONAL)。
  # 這裡預設放很大，只擋離譜的胖手指。
  max-order-qty: ${RISK_MAX_ORDER_QTY:1000000000}
  kill-switch: false
  # ---- 以下為預設值；風控頁可即時改（存 Redis risk:limits:*）。0 = 關閉該規則 ----
  max-position-pct: ${RISK_MAX_POSITION_PCT:0.5}            # BUY 後非穩定幣市值 / 權益 ≤ 50%
  max-daily-loss-pct: ${RISK_MAX_DAILY_LOSS_PCT:0.03}       # 當日權益較日初跌 ≥ 3% 停止買入（台北日）
  max-daily-orders: ${RISK_MAX_DAILY_ORDERS:50}             # 每日下單次數
  max-daily-notional-usdt: ${RISK_MAX_DAILY_NOTIONAL:0}     # 每日名目總額
  max-price-deviation-pct: ${RISK_MAX_PRICE_DEVIATION:0.05} # 限價偏離現價 > 5% 拒（胖手指）
  fail-closed: ${RISK_FAIL_CLOSED:true}                     # 帳戶權益拿不到 → 拒絕 BUY
