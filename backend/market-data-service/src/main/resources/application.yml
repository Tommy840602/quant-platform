server:
  port: 8082
  servlet:
    context-path: /api/market

spring:
  application:
    name: market-data-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASS:nacos}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/quant
    username: quant
    password: quant
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

binance:
  ws-base-url: ${MARKET_WS:wss://stream.binance.com:9443}
  rest-base-url: ${MARKET_REST:https://api.binance.com}
  streams:
    - btcusdt@kline_1m
