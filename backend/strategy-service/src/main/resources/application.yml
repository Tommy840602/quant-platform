server:
  port: 8083
  servlet:
    context-path: /api/strategy

spring:
  application:
    name: strategy-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASS:nacos}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/quant
    username: quant
    password: quant
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    consumer:
      group-id: strategy-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.quant.common.*"
        spring.json.value.default.type: com.quant.common.event.MarketDataEvent

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

order:
  notional-usdt: ${ORDER_NOTIONAL_USDT:0}   # 每單目標名目(USDT)；0=用策略原始固定數量
