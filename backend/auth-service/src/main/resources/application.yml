server:
  port: 8081
  servlet:
    context-path: /api/auth

spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        fail-fast: false        # Nacos 還沒好時註冊失敗不炸掉服務，背景重試（以前 failFast=true → 一直重啟）
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASS:nacos}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/quant
    username: quant
    password: quant
  flyway:
    enabled: true
    locations: classpath:db/migration        # 在 common jar 裡，所有接 DB 的服務跑同一份
    baseline-on-migrate: true                 # 既有資料庫（init.sql 建的）沒有 history 表 → 先 baseline
    baseline-version: 0                       # 從 0 起算，V1 仍會跑（V1 全部 IF NOT EXISTS，重跑安全）
  jpa:
    hibernate:
      ddl-auto: validate   # 表結構由 Flyway 管（common/db/migration），JPA 只驗證不建表
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

jwt:
  secret: ${JWT_SECRET:}            # 必填；與 gateway 相同。`openssl rand -base64 48`
  access-token-ttl-seconds: ${JWT_TTL_SECONDS:14400}   # 4h

auth:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}    # 空 = 首次啟動產生隨機密碼並印在 log
