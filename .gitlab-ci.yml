stages: [build, test, package]

backend:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend && mvn -B clean verify
  cache:
    paths: [ ".m2/repository" ]

frontend:
  stage: build
  image: node:20
  script:
    - cd frontend && (npm ci || npm install) && npm run build

research:
  stage: test
  image: python:3.11
  script:
    - cd research && pip install -r requirements.txt
    - python -c "import app.main; print('ok')"

images:
  stage: package
  image: docker:27
  services: [ docker:27-dind ]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - cd backend && docker version
    - echo "build & push images here（依你的 registry 補上 docker login/build/push）"
