# 正式部署（單機 docker-compose）。所有服務同一 docker 網路，以服務名互連。
# 金鑰等機密由同目錄 .env 提供（見 .env.prod 範本）。
# 啟動： docker compose -f docker-compose.prod.yml up -d --build

# 所有容器共用：日誌上限（json-file 預設不限大小，跑幾週就把磁碟吃光）
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# 後端微服務共用：等基礎設施 healthy 才啟動；JVM + Nacos 註冊約 60-90 秒，start_period 內失敗不算
# 後端探針是 liveness（actuator 有回應 200/503 都算活）：Spring health 任一元件 DOWN 就回 503，
# Nacos/Kafka 抖一下整排 unhealthy 沒意義；真正的元件狀態看 /actuator/health 內容
# 只硬等 DB / Redis（Flyway、冪等鍵啟動就要用）；Nacos / Kafka 慢一點沒關係：
# 註冊 fail-fast=false 會背景重試、Kafka client 自己重連。以前四個都等 healthy，
# build 期間 Nacos 探針逾時就 "dependency failed to start" 整排不啟動。
x-backend-deps: &backend-deps
  depends_on:
    nacos:       { condition: service_started }
    kafka:       { condition: service_started }
    redis:       { condition: service_healthy }
    timescaledb: { condition: service_healthy }

x-backend-env: &backend-env
  NACOS_ADDR: nacos:8848
  KAFKA_ADDR: kafka:9092
  REDIS_HOST: redis
  DB_HOST: timescaledb
  DB_PORT: "5432"
  JWT_ENABLED: ${JWT_ENABLED:-true}
  JWT_SECRET: ${JWT_SECRET:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  BINANCE_ENV: ${BINANCE_ENV:-testnet}
  BINANCE_REST: ${BINANCE_REST:-https://testnet.binance.vision}
  MARKET_REST: ${MARKET_REST:-https://api.binance.com}
  BINANCE_API_KEY: ${BINANCE_API_KEY:-}
  BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
  BINANCE_MAINNET_REST: ${BINANCE_MAINNET_REST:-https://api.binance.com}
  BINANCE_MAINNET_API_KEY: ${BINANCE_MAINNET_API_KEY:-}
  BINANCE_MAINNET_API_SECRET: ${BINANCE_MAINNET_API_SECRET:-}
  BINANCE_FUTURES_REST: ${BINANCE_FUTURES_REST:-https://testnet.binancefuture.com}
  BINANCE_FUTURES_WS: ${BINANCE_FUTURES_WS:-wss://stream.binancefuture.com}
  BINANCE_FUTURES_API_KEY: ${BINANCE_FUTURES_API_KEY:-}
  BINANCE_FUTURES_API_SECRET: ${BINANCE_FUTURES_API_SECRET:-}
  BINANCE_MAINNET_FUTURES_REST: ${BINANCE_MAINNET_FUTURES_REST:-https://fapi.binance.com}
  BINANCE_MAINNET_FUTURES_WS: ${BINANCE_MAINNET_FUTURES_WS:-wss://fstream.binance.com}
  BINANCE_MAINNET_FUTURES_API_KEY: ${BINANCE_MAINNET_FUTURES_API_KEY:-}
  BINANCE_MAINNET_FUTURES_API_SECRET: ${BINANCE_MAINNET_FUTURES_API_SECRET:-}
  TRADING_DRY_RUN: ${TRADING_DRY_RUN:-true}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  # ---- User Data Stream（即時成交回報）。以前 compose 沒傳 Ed25519 變數，UDS_ENABLED=true 也靜默不啟動 ----
  BINANCE_UDS_ENABLED: ${BINANCE_UDS_ENABLED:-false}
  BINANCE_WS_API: ${BINANCE_WS_API:-wss://ws-api.testnet.binance.vision/ws-api/v3}
  BINANCE_MAINNET_WS_API: ${BINANCE_MAINNET_WS_API:-wss://ws-api.binance.com:443/ws-api/v3}
  BINANCE_ED25519_API_KEY: ${BINANCE_ED25519_API_KEY:-}
  # 容器內路徑；pem 放在專案 ./secrets/ 目錄（掛載到 /run/secrets，唯讀）
  BINANCE_ED25519_KEY_PATH: ${BINANCE_ED25519_KEY_PATH:-}
  BINANCE_FUTURES_UDS_ENABLED: ${BINANCE_FUTURES_UDS_ENABLED:-false}

services:
  # ---------- 基礎設施 ----------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: qp-timescaledb
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - ts_data:/var/lib/postgresql/data
      - ./infra/init/timescale-init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: qp-redis
    restart: unless-stopped
    # AOF 開啟：冪等鍵、事件去重、現金帳、熔斷狀態、回撤峰值都存這裡，重啟不可歸零
    <<: *logging
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.7.1
    container_name: qp-kafka
    restart: unless-stopped
    <<: *logging
    healthcheck:
      # 先用 TCP 探 9092（零成本）；每 15 秒開一個 JVM 跑 broker-api-versions 在電腦忙時會逾時，
      # 整排後端因 depends_on 被擋住不啟動。JVM 探只在 TCP 通之後偶爾驗證（timeout 放寬）。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092' && (timeout 25 /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || true)"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 用服務名 kafka，容器間才連得到
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: qp-nacos
    restart: unless-stopped
    <<: *logging
    # ⚠️ 官方映像只有 amd64，Apple Silicon 上走模擬，啟動 1-2 分鐘；start_period 給足
    healthcheck:
      # 映像內不一定有 curl：curl → wget → bash /dev/tcp 三段備援，避免探測工具缺席害後端永遠等不到 healthy
      # HTTP 8848 readiness 之外還要等 gRPC 9848 開（後端註冊走 gRPC；8848 好了 9848 常常還要再等幾十秒）
      test: ["CMD-SHELL", "(curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null 2>&1 || wget -qO- http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null 2>&1) && bash -c 'exec 3<>/dev/tcp/127.0.0.1/9848'"]
      interval: 30s
      timeout: 25s
      retries: 10
      start_period: 180s
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m

  # 監控預設不啟動（省記憶體）。要用時： docker compose --profile monitoring ... up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: qp-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    <<: *logging
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: qp-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    <<: *logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  # ---------- 後端微服務（同一 image，以 SERVICE 選擇） ----------
  api-gateway:
    image: quant-backend:latest
    build: { context: ./backend, dockerfile: Dockerfile.prod }
    container_name: qp-api-gateway
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: api-gateway }
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  market-data-service:
    image: quant-backend:latest
    container_name: qp-market-data-service
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: market-data-service }
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/api/market/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  strategy-service:
    image: quant-backend:latest
    container_name: qp-strategy-service
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: strategy-service }
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/api/strategy/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  order-execution-service:
    image: quant-backend:latest
    container_name: qp-order-execution-service
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: order-execution-service }
    volumes:
      - ./secrets:/run/secrets:ro     # Ed25519 pem 放這裡（git 已忽略 *.pem）
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8084/api/order/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  risk-service:
    image: quant-backend:latest
    container_name: qp-risk-service
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: risk-service }
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8085/api/risk/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  account-service:
    image: quant-backend:latest
    container_name: qp-account-service
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: account-service }
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8096/api/account/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  auth-service:
    image: quant-backend:latest
    container_name: qp-auth-service
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: auth-service }
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/auth/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  backtest-service:
    image: quant-backend:latest
    container_name: qp-backtest-service
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: backtest-service }
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8087/api/backtest/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  notification-service:
    image: quant-backend:latest
    container_name: qp-notification-service
    restart: unless-stopped
    environment: { <<: *backend-env, SERVICE: notification-service }
    <<: [*logging, *backend-deps]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/api/notify/actuator/health); [ \"$$code\" = 200 ] || [ \"$$code\" = 503 ]"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ---------- Python 研究/回測 ----------
  research:
    build: { context: ./research }
    container_name: qp-research
    restart: unless-stopped
    <<: *logging
    environment:
      DB_HOST: timescaledb
      DB_PORT: "5432"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      timescaledb: { condition: service_healthy }

  # ---------- 前端（nginx 靜態 + 反代 /api、/research） ----------
  frontend:
    build: { context: ./frontend }
    container_name: qp-frontend
    restart: unless-stopped
    <<: *logging
    ports: ["${FRONTEND_PORT:-8088}:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    # 前端只做反代，後端沒好也先起（nginx 已改動態解析，不會因上游未就緒而起不來）
    depends_on:
      api-gateway: { condition: service_started }
      research:    { condition: service_started }

volumes:
  redis-data:
  ts_data:
