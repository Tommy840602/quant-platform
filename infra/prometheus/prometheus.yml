global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:8080'], labels: { service: 'api-gateway' } }]
  - job_name: 'auth-service'
    metrics_path: /api/auth/actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:8081'], labels: { service: 'auth' } }]
  - job_name: 'market-data-service'
    metrics_path: /api/market/actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:8082'], labels: { service: 'market-data' } }]
  - job_name: 'strategy-service'
    metrics_path: /api/strategy/actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:8083'], labels: { service: 'strategy' } }]
  - job_name: 'order-execution-service'
    metrics_path: /api/order/actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:8084'], labels: { service: 'order-execution' } }]
  - job_name: 'risk-service'
    metrics_path: /api/risk/actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:8085'], labels: { service: 'risk' } }]
  - job_name: 'backtest-service'
    metrics_path: /api/backtest/actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:8087'], labels: { service: 'backtest' } }]
  - job_name: 'account-service'
    metrics_path: /api/account/actuator/prometheus
    static_configs: [{ targets: ['host.docker.internal:8096'], labels: { service: 'account' } }]
