# arm64 (Apple Silicon) 友善版本：
# - Kafka 改用官方 apache/kafka（KRaft 模式，原生多架構、免 Zookeeper）
# - Nacos 無 arm64，強制以 amd64 模擬執行
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: qp-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant
    ports: ["5433:5432"]
    volumes:
      - ts_data:/var/lib/postgresql/data
      - ./init/timescale-init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: qp-redis
    restart: unless-stopped
    # 純記憶體快取（關閉持久化，避免硬崩造成 AOF 壞檔）
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.7.1
    container_name: qp-kafka
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: qp-nacos
    platform: linux/amd64
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"   # 本機開發關閉認證，避免要求 token 密鑰而啟動失敗
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports: ["8848:8848", "9848:9848"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: qp-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: qp-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on: [prometheus]

volumes:
  ts_data:
  redis_data:
