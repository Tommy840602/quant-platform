apiVersion: v1
kind: ConfigMap
metadata:
  name: quant-config
  namespace: quant
data:
  NACOS_ADDR: "nacos:8848"
  NACOS_USER: "nacos"
  NACOS_PASS: "nacos"
  KAFKA_ADDR: "kafka:9092"
  REDIS_HOST: "redis"
  DB_HOST: "timescaledb"
  DB_PORT: "5432"
  TRADING_DRY_RUN: "true"
  JWT_ENABLED: "false"
  JWT_SECRET: "change-me-in-prod-please-use-a-long-random-secret-key"
  BINANCE_UDS_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: quant-secrets
  namespace: quant
type: Opaque
stringData:
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  BINANCE_FUTURES_API_KEY: ""
  BINANCE_FUTURES_API_SECRET: ""
