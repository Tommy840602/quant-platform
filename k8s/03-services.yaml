apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: quant }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: quant/api-gateway:1.0.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: quant-config }
            - secretRef: { name: quant-secrets }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: quant }
spec:
  type: 
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
---
