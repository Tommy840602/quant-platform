server {
    listen 80;
    server_name _;
    # 用 Docker 內建 DNS 動態解析上游：proxy_pass 用變數 + resolver，後端容器重建換 IP 時不必重啟前端。
    # （寫死 http://api-gateway:8080 會在 nginx 啟動時解析一次並快取，之後全部 502）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway  http://api-gateway:8080;
    set $research http://research:8000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;

    # 透過 Cloudflare Tunnel 從外網連進來時的基本防護（本機用也無害）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 內部驗證：/research 不經 gateway 路由，用 auth_request 問 gateway「這個 JWT 有效嗎」
    location = /_auth {
        internal;
        proxy_pass $gateway/api/system/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # SPA：找不到檔案就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → api-gateway（同一 docker 網路，用服務名解析）
    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare Tunnel 帶來的真實來源 IP（登入失敗鎖定看這個）
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # SSE（/api/account/stream）需要關閉緩衝
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Python 研究服務：/research/xxx → research:8000/xxx（去掉前綴；變數版 proxy_pass 需自己 rewrite）
    location /research/ {
        auth_request /_auth;      # 必須帶有效 JWT（以前完全沒驗證，開到外網會被當免費算力）
        rewrite ^/research/(.*)$ /$1 break;
        proxy_pass $research;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
