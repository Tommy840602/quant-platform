server {
    listen 80;
    server_name _;
    # 用 Docker 內建 DNS 動態解析上游：proxy_pass 用變數 + resolver，後端容器重建換 IP 時不必重啟前端。
    # （寫死 http://api-gateway:8080 會在 nginx 啟動時解析一次並快取，之後全部 502）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway  http://api-gateway:8080;
    set $research http://research:8000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA：找不到檔案就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → api-gateway（同一 docker 網路，用服務名解析）
    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/api/account/stream）需要關閉緩衝
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Python 研究服務：/research/xxx → research:8000/xxx（去掉前綴；變數版 proxy_pass 需自己 rewrite）
    location /research/ {
        rewrite ^/research/(.*)$ /$1 break;
        proxy_pass $research;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
